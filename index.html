<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobix Graphix – OBS Overlays</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f6f7ff;background:#080616}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#251056 0,transparent 38%),#080616}
main{width:min(1120px,92vw);margin:auto;padding:64px 0}h1{font-size:clamp(2rem,6vw,4.5rem);margin:0}.lead{color:#bcb8d2;max-width:680px;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:42px}
.card{display:block;color:inherit;text-decoration:none;border:1px solid #3d3562;border-radius:20px;overflow:hidden;background:#100c25;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#d843ff;box-shadow:0 16px 50px #8b24c533}
.preview{aspect-ratio:16/9;display:grid;place-items:center;background:#05040c;padding:18px}.preview img{max-width:100%;max-height:100%}
.info{padding:18px}.info h2{margin:0 0 8px}.meta{color:#9d96b8;font-size:.92rem}
code{color:#65edff}footer{margin-top:42px;color:#77708f}
</style>
</head><body><main>
<h1>OBS Overlays</h1>
<p class="lead">Dauerhafte Browserquellen für Sobix Gaming. Jede Grafik liegt in einem eigenen Ordner und kann unabhängig erweitert oder aktualisiert werden.</p>
<section class="grid" id="grid"></section>
<footer>Repository: <code>sobixgaming/graphix</code></footer>
<script>
fetch('overlays.json').then(r=>r.json()).then(items=>{
 const grid=document.querySelector('#grid');
 items.forEach(x=>{
  const a=document.createElement('a');a.className='card';a.href=x.path;
  a.innerHTML='<div class="preview"><img src="'+x.image+'" alt=""></div><div class="info"><h2>'+x.title+'</h2><div class="meta">'+x.width+' × '+x.height+' · '+x.effect+'</div></div>';
  grid.append(a);
 });
}).catch(()=>document.querySelector('#grid').textContent='Overlays konnten nicht geladen werden.');
</script></main></body></html>
