<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raid Progress – Webcam Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
#stage{position:absolute;left:50%;top:50%;width:min(100vw,177.683vh);height:min(100vh,56.280vw);transform:translate(-50%,-50%);overflow:hidden;background:transparent!important;isolation:isolate}
#frame{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:fill;pointer-events:none}
.glow{position:absolute;z-index:4;left:var(--x);top:var(--y);width:var(--s);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,255,255,.98) 0 2.5%,rgba(var(--c),.96) 5%,rgba(var(--c),.62) 16%,rgba(var(--c),.28) 34%,rgba(var(--c),.08) 55%,transparent 72%);filter:drop-shadow(0 0 5px rgba(var(--c),.95)) drop-shadow(0 0 14px rgba(var(--c),.78));animation:glowPulse var(--t,2.35s) ease-in-out infinite var(--d,0s)}
.glow:before,.glow:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent 0 44%,rgba(255,255,255,.08) 46%,white 50%,rgba(255,255,255,.08) 54%,transparent 56%);filter:drop-shadow(0 0 4px rgba(var(--c),1));opacity:.88}
.glow:before{width:100%;height:13%;animation:sparkX var(--t,2.35s) ease-in-out infinite var(--d,0s)}
.glow:after{width:13%;height:100%;background:linear-gradient(0deg,transparent 0 44%,rgba(255,255,255,.08) 46%,white 50%,rgba(255,255,255,.08) 54%,transparent 56%);animation:sparkY var(--t,2.35s) ease-in-out infinite var(--d,0s)}
@keyframes glowPulse{0%,100%{opacity:.58;transform:translate(-50%,-50%) scale(.82)}48%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}68%{opacity:.82;transform:translate(-50%,-50%) scale(.98)}}
@keyframes sparkX{0%,100%{transform:translate(-50%,-50%) scaleX(.46);opacity:.35}48%{transform:translate(-50%,-50%) scaleX(1.15);opacity:1}68%{transform:translate(-50%,-50%) scaleX(.76);opacity:.62}}
@keyframes sparkY{0%,100%{transform:translate(-50%,-50%) scaleY(.46);opacity:.35}48%{transform:translate(-50%,-50%) scaleY(1.15);opacity:1}68%{transform:translate(-50%,-50%) scaleY(.76);opacity:.62}}
</style>
</head>
<body>
<main id="stage" aria-label="Raid-Progress-Webcam-Rahmen mit leuchtenden Edelsteinen">

 <i class="glow" style="--x:17.1%;--y:91.1%;--s:6.5%;--c:25,213,255;--d:-1.9s"></i>
 <i class="glow" style="--x:35.2%;--y:96.3%;--s:5.1%;--c:25,213,255;--d:-.8s"></i>
