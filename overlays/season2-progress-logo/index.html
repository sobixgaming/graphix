<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Season 2 Progress – OBS Logo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: transparent !important;
    }
    body { display: grid; place-items: center; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .stage {
      position: relative;
      width: min(92vw, 1672px);
      aspect-ratio: 1672 / 941;
      animation: hover 6s ease-in-out infinite;
      isolation: isolate;
    }
    .mask {
      position: absolute; inset: 0;
      -webkit-mask: url('logo.webp') center / contain no-repeat;
      mask: url('logo.webp') center / contain no-repeat;
      pointer-events: none;
    }
    .poison-aura {
      z-index: -3;
      background: radial-gradient(circle at 50% 48%, #b8ff24 0 20%, #29ff4d 38%, #00d786 70%);
      transform: scale(1.025);
      filter: blur(24px) saturate(1.6);
      opacity: .24;
      animation: aura 3.2s ease-in-out infinite;
    }
    .logo {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
      z-index: 1;
      filter: drop-shadow(0 7px 12px #000b) drop-shadow(0 0 7px #5aff5a80);
    }
    .poison-flow {
      z-index: 2;
      opacity: .33;
      mix-blend-mode: screen;
      background:
        radial-gradient(circle at 20% 70%, #d8ff80 0 2%, transparent 12%),
        radial-gradient(circle at 72% 25%, #6eff00 0 2%, transparent 13%),
        repeating-linear-gradient(98deg, transparent 0 12%, #62ff5038 15%, transparent 19% 31%);
      background-size: 125% 125%, 140% 140%, 180% 100%;
      animation: flow 5s linear infinite;
    }
    .letter-outline {
      z-index: 3;
      -webkit-mask: url('letter-outline.png') center / contain no-repeat;
      mask: url('letter-outline.png') center / contain no-repeat;
      background: #e9a714;
      opacity: .28;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 3px #ffb000);
    }
    .letter-runner {
      z-index: 4;
      -webkit-mask: url('letter-outline.png') center / contain no-repeat;
      mask: url('letter-outline.png') center / contain no-repeat;
      background: conic-gradient(from var(--turn) at 50% 48%,
        transparent 0deg 258deg,
        #9a540020 275deg,
        #ffb000 294deg,
        #fff7bd 306deg,
        #ffca29 320deg,
        transparent 342deg 360deg);
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 4px #ffd23c) drop-shadow(0 0 10px #ff8a00);
      animation: clockwise 5.2s linear infinite;
    }
    .under-glow {
      position: absolute; z-index: -4; left: 9%; right: 9%; bottom: 3%; height: 14%;
      border-radius: 50%;
      background: radial-gradient(ellipse, #8dff2fcc, #09ef6360 42%, transparent 72%);
      filter: blur(18px);
      animation: underGlow 2.3s ease-in-out infinite;
    }
    .drip {
      position: absolute; z-index: 4; top: 80%; width: clamp(3px,.45vw,8px);
      height: clamp(22px,5vw,68px); border-radius: 50% 50% 65% 65%;
      background: linear-gradient(#b7ff45, #12f34a 65%, #00a86600);
      filter: drop-shadow(0 0 6px #63ff1a);
      opacity: 0;
      animation: drip 4s ease-in infinite;
    }
    .d1 { left: 28%; animation-delay: .4s; }
    .d2 { left: 49%; animation-delay: 2.1s; height: clamp(16px,3.5vw,50px); }
    .d3 { left: 74%; animation-delay: 3.2s; }
    @keyframes hover {
      0%,100% { transform: translateY(0) scale(.992); }
      50% { transform: translateY(-7px) scale(1); }
    }
    @keyframes aura {
      0%,100% { opacity:.18; transform:scale(1.02); }
      50% { opacity:.34; transform:scale(1.035); }
    }
    @keyframes flow {
      from { background-position: 0 30%, 90% 10%, 0 0; }
      to { background-position: 80% -20%, 10% 90%, 180% 0; }
    }
    @property --turn { syntax:'<angle>'; inherits:false; initial-value:0deg; }
    @keyframes clockwise { to { --turn:360deg; } }
    @keyframes underGlow {
      0%,100% { opacity:.38; transform:scaleX(.92); }
      50% { opacity:.8; transform:scaleX(1.06); }
    }
    @keyframes drip {
      0%,18% { opacity:0; transform:translateY(-10px) scaleY(.25); }
      28% { opacity:.85; }
      67% { opacity:.7; transform:translateY(80px) scaleY(1); }
      80%,100% { opacity:0; transform:translateY(115px) scale(.35); }
    }
    @media (prefers-reduced-motion: reduce) {
      .stage,.mask,.under-glow,.drip { animation:none !important; }
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="stage" id="stage">
    <div class="under-glow"></div>
    <div class="mask poison-aura"></div>
    <img class="logo" src="logo.webp" alt="Season 2 Progress">
    <div class="mask poison-flow"></div>
    <div class="mask letter-outline"></div>
    <div class="mask letter-runner"></div>
    <i class="drip d1"></i><i class="drip d2"></i><i class="drip d3"></i>
  </div>
  <script>
    const canvas = document.querySelector('#fx');
    const ctx = canvas.getContext('2d');
    const stage = document.querySelector('#stage');
    let dpr = 1, W = 0, H = 0, particles = [];
    const rnd = (a,b) => a + Math.random() * (b-a);
    function resize(){
      dpr = Math.min(devicePixelRatio || 1, 2); W=innerWidth; H=innerHeight;
      canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      particles=[]; for(let i=0;i<44;i++) particles.push(spawn(true));
    }
    function spawn(initial=false){
      const r=stage.getBoundingClientRect();
      const side=Math.random()<.35;
      return {
        x: side ? (Math.random()<.5 ? r.left+r.width*rnd(.02,.18) : r.right-r.width*rnd(.02,.18)) : r.left+r.width*rnd(.10,.90),
        y: initial ? rnd(r.top+r.height*.18,r.bottom+r.height*.13) : r.bottom+rnd(-12,45),
        vx:rnd(-.18,.18), vy:rnd(-.36,-.12), size:rnd(1.2,5.3), life:rnd(0,1), speed:rnd(.0025,.0065), hue:rnd(86,145)
      };
    }
    function frame(){
      ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter';
      for(let i=0;i<particles.length;i++){
        let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.life+=p.speed;
        if(p.life>1 || p.y<-20) p=particles[i]=spawn(false);
        const a=Math.sin(Math.PI*p.life)*.7;
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*3.2);
        g.addColorStop(0,`hsla(${p.hue},100%,78%,${a})`);
        g.addColorStop(.28,`hsla(${p.hue},100%,52%,${a*.65})`);
        g.addColorStop(1,`hsla(${p.hue},100%,35%,0)`);
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*3.2,0,Math.PI*2); ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    addEventListener('resize',resize,{passive:true}); resize(); frame();
  </script>
</body>
</html>
