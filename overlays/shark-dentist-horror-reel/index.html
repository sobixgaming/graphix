<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shark Dentist – Horror Reel</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020609}body{display:grid;place-items:center}.reel{position:relative;height:100vh;max-width:100vw;aspect-ratio:9/16;overflow:hidden;isolation:isolate;background:#020609}
.poster{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;z-index:1;animation:breath 10s ease-in-out infinite,lunge 7s cubic-bezier(.2,.8,.2,1) infinite;will-change:transform,filter}
.cold{position:absolute;inset:0;z-index:2;background:radial-gradient(circle at 17% 9%,#dffaff88 0 5%,#8feaff30 10%,transparent 27%),radial-gradient(circle at 54% 21%,#8b000044 0 12%,transparent 38%);mix-blend-mode:screen;animation:lamp 4.8s steps(1) infinite}
.alarm{position:absolute;inset:0;z-index:3;background:linear-gradient(105deg,transparent 26%,#ff001555 42%,#ff0000aa 49%,#ff243755 55%,transparent 70%);background-size:280% 100%;mix-blend-mode:screen;animation:alarm 5.6s ease-in-out infinite}
.fog{position:absolute;inset:55% -30% -20%;z-index:4;background:radial-gradient(ellipse at 30% 70%,#a5e6ef38,transparent 45%),radial-gradient(ellipse at 72% 45%,#d5faff2d,transparent 42%);filter:blur(28px);animation:fog 9s ease-in-out infinite alternate}
.blood{position:absolute;z-index:6;inset:0 0 auto;height:11%;background:linear-gradient(#2b0000,#7c0000 70%,#bd0000);filter:drop-shadow(0 5px 8px #000c);clip-path:polygon(0 0,100% 0,100% 35%,93% 37%,90% 72%,87% 38%,75% 34%,72% 92%,69% 35%,58% 39%,55% 67%,52% 39%,40% 35%,36% 82%,33% 38%,20% 34%,16% 62%,13% 35%,0 40%);animation:drip 6s ease-in-out infinite}
.vhs{position:absolute;inset:0;z-index:8;opacity:.13;background:repeating-linear-gradient(0deg,transparent 0 3px,#bcecff1b 4px);animation:vhs 7s steps(1) infinite;pointer-events:none}.vignette{position:absolute;inset:0;z-index:7;box-shadow:inset 0 0 130px #000,inset 0 -90px 110px #000b;pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:9;pointer-events:none}
@keyframes breath{0%,100%{transform:scale(1.015) translate(0,0)}50%{transform:scale(1.075) translate(.8%,-.6%)}}
@keyframes lunge{0%,68%,74%,100%{filter:contrast(1.05) saturate(.92)}70%{filter:contrast(1.28) saturate(.7) brightness(.83);transform:scale(1.13) translateY(1%)}72%{filter:contrast(1.12) saturate(1.15)}}
@keyframes lamp{0%,11%,14%,48%,51%,100%{opacity:1}12%,49%{opacity:.28}13%,50%{opacity:.72}}
@keyframes alarm{0%,18%{background-position:140% 0;opacity:0}32%{opacity:.9}58%,100%{background-position:-70% 0;opacity:0}}
@keyframes fog{to{transform:translateX(14%) scale(1.1)}}@keyframes drip{0%,100%{transform:translateY(-12%)}50%{transform:translateY(3%)}}@keyframes vhs{0%,92%,100%{transform:none}93%{transform:translateX(8px)}94%{transform:translateX(-5px)}95%{transform:none}}
</style></head><body><main class="reel" aria-label="Animiertes Shark Dentist Horror Reel"><img class="poster" src="poster.jpg?v=1" alt="Shark Dentist Horror Reel"><div class="cold"></div><div class="alarm"></div><div class="fog"></div><div class="blood"></div><div class="vignette"></div><div class="vhs"></div><canvas></canvas></main>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),stage=document.querySelector('.reel');let w,h,dpr,drops=[],sparks=[];function size(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(size).observe(stage);size();
function blood(){drops.push({x:Math.random()*w,y:-15,r:2+Math.random()*5,vy:.7+Math.random()*1.8,a:.35+Math.random()*.55})}function spark(){sparks.push({x:w*(.73+Math.random()*.17),y:h*(.48+Math.random()*.18),vx:-.9+Math.random()*1.8,vy:-1.8+Math.random()*.8,l:20+Math.random()*28})}
(function loop(){x.clearRect(0,0,w,h);if(drops.length<24&&Math.random()<.08)blood();if(sparks.length<15&&Math.random()<.055)spark();x.globalCompositeOperation='source-over';drops=drops.filter(o=>{o.y+=o.vy;o.vy+=.014;x.globalAlpha=o.a;x.fillStyle='#9d0000';x.shadowBlur=8;x.shadowColor='#ff001e';x.beginPath();x.ellipse(o.x,o.y,o.r*.58,o.r*1.7,0,0,7);x.fill();return o.y<h+20});x.globalCompositeOperation='lighter';sparks=sparks.filter(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=.06;o.l--;x.globalAlpha=Math.max(0,o.l/38);x.strokeStyle='#bff8ff';x.lineWidth=1.4;x.beginPath();x.moveTo(o.x,o.y);x.lineTo(o.x-o.vx*5,o.y-o.vy*5);x.stroke();return o.l>0});x.globalAlpha=1;requestAnimationFrame(loop)})();
</script></body></html>
