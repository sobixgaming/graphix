<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pepe Break Timer – OBS</title>
  <style>
    :root{--cyan:#43f6ff;--pink:#ff38d1;--lime:#a9ff55;--ink:#070812}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050610;font-family:Inter,Segoe UI,system-ui,sans-serif;color:#fff}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 22% 48%,#0a5f6655,transparent 30%),radial-gradient(circle at 82% 30%,#84206c44,transparent 34%),linear-gradient(135deg,#04050b,#0a1020 48%,#08030e);animation:bg 9s ease-in-out infinite alternate}
    body:after{content:"";position:fixed;inset:0;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 3px,#83faff18 4px);pointer-events:none}
    canvas{position:fixed;inset:0;width:100%;height:100%}.layout{position:relative;z-index:2;width:100%;height:100%;display:grid;grid-template-columns:1.08fr .92fr;align-items:center;padding:7vh 7vw;gap:5vw}
    .copy{position:relative}.eyebrow{display:flex;align-items:center;gap:14px;color:var(--cyan);font-weight:800;letter-spacing:.32em;font-size:clamp(14px,1.15vw,24px)}.live-dot{width:12px;height:12px;border-radius:50%;background:var(--lime);box-shadow:0 0 18px var(--lime);animation:pulse 1.4s infinite}
    h1{margin:.16em 0 0;font-size:clamp(70px,8.5vw,172px);line-height:.82;letter-spacing:-.07em;text-transform:uppercase;text-shadow:0 0 34px #43f6ff35}h1 span{display:block;color:transparent;-webkit-text-stroke:2px var(--pink);filter:drop-shadow(0 0 14px #ff38d155)}
    .sub{margin:3vh 0 4vh;max-width:760px;color:#cad5e8;font-size:clamp(18px,1.55vw,31px);letter-spacing:.035em}.timer-row{display:flex;align-items:center;gap:2.3vw}.ring{position:relative;width:clamp(180px,17vw,330px);aspect-ratio:1}.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 16px #43f6ff66)}circle{fill:none;stroke-width:8}.track{stroke:#ffffff18}.progress{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset .35s linear}.time{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(42px,4.5vw,88px)/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:-.08em}.label{font-weight:800;letter-spacing:.2em;color:#92a0b9;font-size:clamp(13px,1vw,20px)}.hint{margin-top:10px;color:var(--lime);font-weight:700;font-size:clamp(16px,1.25vw,25px)}
    .pod{position:relative;width:min(39vw,720px);justify-self:end;aspect-ratio:1}.orbit{position:absolute;inset:-5%;border:2px solid #43f6ff33;border-radius:46% 54% 52% 48%;animation:spin 16s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--cyan);box-shadow:0 0 24px var(--cyan)}.orbit:before{left:10%;top:15%}.orbit:after{right:8%;bottom:18%;background:var(--pink);box-shadow:0 0 24px var(--pink)}
    .photo-shell{position:absolute;inset:4%;border-radius:42% 58% 44% 56%;padding:11px;background:linear-gradient(135deg,var(--cyan),#704dff 48%,var(--pink));box-shadow:0 0 60px #43f6ff35,0 0 90px #ff38d126;animation:float 4.8s ease-in-out infinite}.photo{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;filter:saturate(1.08) contrast(1.04)}.glass{position:absolute;inset:4%;border-radius:inherit;background:linear-gradient(115deg,#fff2 0 12%,transparent 24% 70%,#43f6ff20);mix-blend-mode:screen;pointer-events:none}
    .bubble{position:absolute;padding:.7em 1em;border:1px solid #ffffff33;border-radius:999px;background:#090b19cc;backdrop-filter:blur(8px);font-weight:800;letter-spacing:.08em;box-shadow:0 12px 40px #0008;animation:float 4s ease-in-out infinite}.b1{left:-8%;top:13%;color:var(--cyan)}.b2{right:-4%;bottom:12%;color:var(--pink);animation-delay:-2s}
    .equalizer{position:absolute;left:0;bottom:-4vh;display:flex;align-items:end;gap:7px;height:45px}.equalizer i{display:block;width:6px;height:30%;border-radius:9px;background:linear-gradient(var(--cyan),var(--pink));animation:eq .8s ease-in-out infinite alternate}.equalizer i:nth-child(2){animation-delay:-.35s}.equalizer i:nth-child(3){animation-delay:-.6s}.equalizer i:nth-child(4){animation-delay:-.2s}.equalizer i:nth-child(5){animation-delay:-.5s}
    @keyframes bg{to{filter:hue-rotate(18deg);transform:scale(1.04)}}@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-18px) rotate(.6deg)}}@keyframes eq{to{height:100%}}
  </style>
</head>
<body><canvas></canvas><main class="layout">
  <section class="copy"><div class="eyebrow"><i class="live-dot"></i>STREAM PAUSIERT</div><h1>KURZE<span>PAUSE</span></h1><p class="sub">Pepe bewacht den Stream. Gleich geht es weiter.</p>
    <div class="timer-row"><div class="ring"><svg viewBox="0 0 120 120"><defs><linearGradient id="grad"><stop stop-color="#43f6ff"/><stop offset="1" stop-color="#ff38d1"/></linearGradient></defs><circle class="track" cx="60" cy="60" r="52"/><circle class="progress" cx="60" cy="60" r="52"/></svg><div class="time">05:00</div></div><div><div class="label">NOCH UNGEFÄHR</div><div class="hint">Bleib kurz da ✦</div></div></div>
    <div class="equalizer"><i></i><i></i><i></i><i></i><i></i></div>
  </section>
  <section class="pod"><div class="orbit"></div><div class="photo-shell"><img class="photo" src="pepe.jpg?v=1" alt="Pepe wartet auf das Ende der Pause"><div class="glass"></div></div><div class="bubble b1">CHILL MODE</div><div class="bubble b2">BRB ✦</div></section>
</main><script>
  const q=new URLSearchParams(location.search),minutes=Math.max(.1,Math.min(180,Number(q.get('minutes'))||5)),total=Math.round(minutes*60),end=Date.now()+total*1000;
  const time=document.querySelector('.time'),progress=document.querySelector('.progress'),hint=document.querySelector('.hint'),C=2*Math.PI*52;progress.style.strokeDasharray=C;
  function update(){const left=Math.max(0,Math.ceil((end-Date.now())/1000)),m=Math.floor(left/60),s=left%60;time.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');progress.style.strokeDashoffset=C*(1-left/total);if(!left){hint.textContent='GLEICH ZURÜCK ✦';document.title='Pause beendet';return}requestAnimationFrame(update)}update();
  const c=document.querySelector('canvas'),x=c.getContext('2d');let w,h,p=[];function size(){w=c.width=innerWidth;h=c.height=innerHeight}addEventListener('resize',size);size();
  for(let i=0;i<80;i++)p.push({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*3,v:.15+Math.random()*.55,a:.15+Math.random()*.55,c:Math.random()>.5?'#43f6ff':'#ff38d1'});
  (function draw(){x.clearRect(0,0,w,h);x.globalCompositeOperation='lighter';p.forEach(o=>{o.y-=o.v;if(o.y<-10){o.y=h+10;o.x=Math.random()*w}x.globalAlpha=o.a;x.fillStyle=o.c;x.shadowBlur=12;x.shadowColor=o.c;x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()});requestAnimationFrame(draw)})();
</script></body></html>
