<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Splitruns Season 2 – OBS Overlay</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
.stage{position:relative;width:100%;height:100%;display:grid;place-items:center}.logo,.shine{position:absolute;width:100%;height:100%;object-fit:contain}.logo{display:block}
.shine{background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.08) 44%,rgba(255,255,255,.95) 49%,rgba(255,255,255,.22) 54%,transparent 61%);background-size:45% 100%;background-repeat:no-repeat;-webkit-mask:url("../../SplitrunsS2.webp") center/contain no-repeat;mask:url("../../SplitrunsS2.webp") center/contain no-repeat;mix-blend-mode:screen;filter:drop-shadow(0 0 10px rgba(255,255,255,.7));animation:glint 3.6s ease-in-out infinite;will-change:background-position}
@keyframes glint{0%,18%{background-position:-80% 0;opacity:0}24%{opacity:1}66%{opacity:1}76%,100%{background-position:220% 0;opacity:0}}
</style></head><body><main class="stage"><img class="logo" src="../../SplitrunsS2.webp" alt="Welcome to Season 2 Splitruns"><div class="shine" aria-hidden="true"></div></main></body></html>
