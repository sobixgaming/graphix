<!doctype html>
<html lang="de">
<head>

<title>Sobix Blutrahmen – Animation v2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden;background:rgba(0,0,0,0)!important;background-color:transparent!important}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,101.122694vh);height:min(98.889770vw,100vh);background:transparent!important;flex:none}
#frame{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
.stream{position:absolute;left:var(--x);top:var(--y);height:var(--length);width:.74%;pointer-events:none;z-index:2}
.thread{position:absolute;inset:0 22%;border-radius:45%;transform-origin:50% 0;background:linear-gradient(90deg,#370006,#aa0a18 32%,#dc2531 46%,#72000b 80%,#370006);animation:run var(--time) linear var(--delay) infinite both}
.thread:after{content:"";position:absolute;left:29%;top:0;width:12%;height:22%;border-radius:50%;background:rgba(255,202,188,.65);animation:wet 2.1s linear var(--delay) infinite}
.drop{position:absolute;left:0;top:0;width:100%;height:18%;min-height:5px;border-radius:48% 48% 58% 58%;background:radial-gradient(ellipse at 30% 38%,#f27070 0%,#bf1021 24%,#81000d 61%,#390005 100%);animation:fall var(--time) linear var(--delay) infinite both;transform-origin:50% 0}
/* Blood moves without JavaScript and without an OS reduced-motion gate. */
@keyframes run{0%{transform:scaleY(.08);opacity:.3}12%{opacity:.95}66%{transform:scaleY(1);opacity:.96}80%{transform:scaleY(1);opacity:.8}96%,100%{transform:scaleY(1);opacity:0}}
@keyframes fall{0%{top:0;transform:scale(.5);opacity:0}8%{opacity:1}66%{top:87%;transform:scale(1.3,1.2);opacity:1}72%{top:98%;transform:scale(1.1,1.5);opacity:1}86%{top:147%;transform:scale(.85,1.6);opacity:.65}93%,100%{top:184%;transform:scale(.7,1.2);opacity:0}}
@keyframes wet{0%{top:0;opacity:0}20%{opacity:.65}80%{opacity:.65}100%{top:78%;opacity:0}}
</style>
</head>
<body>
<main id="stage" aria-label="Transparenter Webcam-Rahmen mit animiertem Blut">
<img id="frame" src="frame.webp?v=2" alt="Runder Sobix-Horrorrahmen">

</main>
</body>
</html>
