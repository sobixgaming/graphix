<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mecca Chameleon – OBS Logo</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important}
    body{display:grid;place-items:center}
    canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
    .stage{position:relative;width:min(92vw,1536px);aspect-ratio:1536/657;isolation:isolate;animation:impact 5.6s ease-in-out infinite}
    .mask{position:absolute;inset:0;pointer-events:none;-webkit-mask:url('logo.webp') center/contain no-repeat;mask:url('logo.webp') center/contain no-repeat}
    .deep-aura{z-index:-5;transform:scale(1.055);opacity:.34;filter:blur(34px) saturate(1.8);background:conic-gradient(from var(--spin),#1eff60,#00eaff,#4535ff,#ff27ef,#ffb000,#1eff60);animation:spin 6s linear infinite,auraPulse 1.8s ease-in-out infinite}
    .outline{z-index:-3;transform:scale(1.019);background:linear-gradient(100deg,#52ff2c,#00f6ff 33%,#4169ff 55%,#ff34e8 76%,#ffe13b);filter:drop-shadow(0 0 7px #67ffff) drop-shadow(0 0 18px #00d8ff) drop-shadow(0 0 34px #bd28ffbb);animation:outlinePulse 1.55s ease-in-out infinite}
    .runner{z-index:-2;transform:scale(1.032);background:conic-gradient(from var(--turn) at 50% 48%,transparent 0 248deg,#00ff8050 268deg,#40ffff 289deg,#ffffff 304deg,#ff4ced 322deg,#ffe13c 334deg,transparent 349deg 360deg);filter:drop-shadow(0 0 12px #8fffff) drop-shadow(0 0 30px #e62cff);animation:clockwise 4.1s linear infinite}
    .logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;filter:drop-shadow(0 9px 15px #000c) drop-shadow(0 0 5px #00eaff99)}
    .color-flow{z-index:2;opacity:.35;mix-blend-mode:screen;background:repeating-linear-gradient(112deg,transparent 0 13%,#00ff6948 16%,#13eaff42 19%,#ff32e947 22%,transparent 27% 40%);background-size:220% 100%;animation:flow 4.3s linear infinite}
    .gold-shine{z-index:4;opacity:0;mix-blend-mode:screen;clip-path:polygon(12% 7%,74% 7%,74% 49%,12% 49%);background:linear-gradient(104deg,transparent 0 40%,#ff9f1855 45%,#fff2a5 49%,#ffffff 51%,#ffd13dce 55%,transparent 62% 100%);transform:translateX(-125%);animation:goldShine 3.9s ease-in-out infinite}
    .rainbow-shine{z-index:3;opacity:.55;mix-blend-mode:screen;clip-path:polygon(3% 35%,94% 35%,94% 84%,3% 84%);background:linear-gradient(100deg,transparent 0 35%,#5dff57 42%,#00f6ff 48%,#5e58ff 53%,#ff2ddd 58%,transparent 66% 100%);transform:translateX(-135%);animation:rainbow 4.8s ease-in-out infinite .6s}
    .bottom-flare{position:absolute;z-index:5;left:18%;right:12%;bottom:2%;height:19%;border-radius:50%;background:radial-gradient(ellipse,#ffffb5bb,#54ff3f80 25%,#00d9ff4d 48%,transparent 72%);filter:blur(16px);mix-blend-mode:screen;animation:bottomPulse 1.7s ease-in-out infinite}
    .eye{position:absolute;z-index:6;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,#fff 0 9%,#ffe96f 18%,#67ff9a70 43%,transparent 70%);filter:blur(3px);animation:eyeFlash 2.35s ease-in-out infinite}
    .eye.one{left:72.1%;top:11.5%;width:7.5%;height:17.5%}
    .eye.two{left:79.5%;top:12%;width:7.2%;height:17% ;animation-delay:.16s}
    .orbit{position:absolute;z-index:-6;left:5%;right:5%;top:5%;bottom:4%;border-radius:50%;border:3px solid #00eeff90;box-shadow:0 0 18px #00efff,0 0 42px #a92fff inset;animation:orbit 5s linear infinite}
    @property --turn{syntax:'<angle>';inherits:false;initial-value:0deg}
    @property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
    @keyframes clockwise{to{--turn:360deg}}
    @keyframes spin{to{--spin:360deg}}
    @keyframes impact{0%,100%{transform:scale(.982) translateY(5px)}8%{transform:scale(1.018) translateY(-5px)}14%{transform:scale(.997) rotate(-.25deg)}22%{transform:scale(1.006) rotate(.18deg)}50%{transform:scale(1) translateY(-7px)}}
    @keyframes auraPulse{0%,100%{opacity:.22;transform:scale(1.04)}50%{opacity:.58;transform:scale(1.075)}}
    @keyframes outlinePulse{0%,100%{opacity:.62}50%{opacity:1;filter:drop-shadow(0 0 12px #baffff) drop-shadow(0 0 29px #00efff) drop-shadow(0 0 45px #da2cff)}}
    @keyframes flow{from{background-position:0 0}to{background-position:220% 0}}
    @keyframes goldShine{0%,11%{transform:translateX(-125%);opacity:0}20%{opacity:1}51%{transform:translateX(125%);opacity:.95}59%,100%{transform:translateX(125%);opacity:0}}
    @keyframes rainbow{0%,10%{transform:translateX(-135%);opacity:0}20%{opacity:.72}58%{transform:translateX(135%);opacity:.65}66%,100%{transform:translateX(135%);opacity:0}}
    @keyframes bottomPulse{0%,100%{opacity:.25;transform:scaleX(.88)}50%{opacity:.85;transform:scaleX(1.08)}}
    @keyframes eyeFlash{0%,100%{opacity:.1;transform:scale(.55)}42%{opacity:.16}52%{opacity:1;transform:scale(1.23)}64%{opacity:.22;transform:scale(.75)}}
    @keyframes orbit{from{transform:rotate(0deg) scale(.92)}50%{transform:rotate(180deg) scale(1.03);border-color:#ff34e8aa}to{transform:rotate(360deg) scale(.92)}}
    @media(prefers-reduced-motion:reduce){.stage,.mask,.eye,.orbit,.bottom-flare{animation:none!important}}
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="stage" id="stage">
    <div class="orbit"></div><div class="mask deep-aura"></div><div class="mask outline"></div><div class="mask runner"></div>
    <img class="logo" src="logo.webp" alt="Mecca Chameleon Sobix and Friends">
    <div class="mask color-flow"></div><div class="mask rainbow-shine"></div><div class="mask gold-shine"></div>
    <div class="bottom-flare"></div><div class="eye one"></div><div class="eye two"></div>
  </div>
  <script>
    const canvas=document.querySelector('#fx'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage');let W=0,H=0,dpr=1,parts=[];const rnd=(a,b)=>a+Math.random()*(b-a);
    function spawn(initial=false){const r=stage.getBoundingClientRect(),edge=Math.floor(Math.random()*4);let x,y;if(edge===0){x=r.left+r.width*rnd(.04,.96);y=r.top+r.height*rnd(.03,.14)}else if(edge===1){x=r.left+r.width*rnd(.02,.14);y=r.top+r.height*rnd(.15,.9)}else if(edge===2){x=r.right-r.width*rnd(.02,.14);y=r.top+r.height*rnd(.12,.9)}else{x=r.left+r.width*rnd(.12,.88);y=r.bottom-r.height*rnd(.03,.15)}return{x,y,vx:rnd(-.55,.55),vy:rnd(-.65,-.08),s:rnd(1.2,5.8),life:initial?rnd(0,1):0,speed:rnd(.004,.011),h:rnd(90,320)}}
    function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);parts=[];for(let i=0;i<78;i++)parts.push(spawn(true))}
    function star(x,y,s,a,h){ctx.save();ctx.translate(x,y);ctx.strokeStyle=`hsla(${h},100%,72%,${a})`;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-s*3,0);ctx.lineTo(s*3,0);ctx.moveTo(0,-s*3);ctx.lineTo(0,s*3);ctx.stroke();ctx.restore()}
    function draw(){ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';parts.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.life+=p.speed;if(p.life>1)parts[i]=p=spawn(false);const a=Math.sin(Math.PI*p.life);const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*4);g.addColorStop(0,`hsla(${p.h},100%,90%,${a})`);g.addColorStop(.2,`hsla(${p.h},100%,58%,${a*.8})`);g.addColorStop(1,`hsla(${p.h},100%,45%,0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.s*4,0,Math.PI*2);ctx.fill();if(p.s>4&&a>.7)star(p.x,p.y,p.s,a,p.h)});requestAnimationFrame(draw)}
    addEventListener('resize',resize,{passive:true});resize();draw();
  </script>
</body>
</html>
