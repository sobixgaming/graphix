<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Very Safe Dino Park – Animated Reel</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07140e}body{display:grid;place-items:center}
    .reel{position:relative;height:100vh;max-width:100vw;aspect-ratio:9/16;overflow:hidden;background:#0b2014;isolation:isolate}
    .poster{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;animation:camera 12s ease-in-out infinite alternate,impact 8s ease-in-out infinite;will-change:transform;z-index:1}
    .depth{position:absolute;inset:0;z-index:2;background:radial-gradient(circle at 73% 39%,#ff603b55 0 3%,#ff9b3833 6%,transparent 18%),linear-gradient(115deg,transparent 22%,#fff9 42%,transparent 52%);background-size:100% 100%,260% 100%;mix-blend-mode:screen;animation:volcano 3.4s ease-in-out infinite,ray 7s ease-in-out infinite;pointer-events:none}
    .vignette{position:absolute;inset:0;z-index:4;box-shadow:inset 0 0 120px #001509bb,inset 0 -110px 110px #00120aaa;pointer-events:none}
    .shine{position:absolute;z-index:5;inset:0;background:linear-gradient(105deg,transparent 35%,#fff0 43%,#fff9 49%,#ffd85255 53%,transparent 62%);background-size:300% 100%;mix-blend-mode:screen;animation:sweep 6.8s ease-in-out infinite;pointer-events:none}
    .ptero{position:absolute;z-index:3;top:13%;left:-20%;width:14%;filter:drop-shadow(0 5px 5px #0008);opacity:.58;animation:fly 11s linear infinite}.ptero svg{width:100%;overflow:visible;animation:flap .65s ease-in-out infinite alternate;transform-origin:center}
    canvas{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
    .badge{position:absolute;z-index:7;right:3.5%;top:1.8%;padding:.65em .9em;border-radius:999px;background:#07140dcc;border:1px solid #ffcf3d99;color:#ffe36c;font:900 clamp(9px,1.45vh,22px)/1 system-ui,sans-serif;letter-spacing:.13em;box-shadow:0 0 24px #ff9a3044;animation:badge 2s ease-in-out infinite}
    @keyframes camera{0%{transform:scale(1.02) translate3d(-.4%,.4%,0)}100%{transform:scale(1.085) translate3d(1.2%,-1.1%,0)}}
    @keyframes impact{0%,71%,75%,79%,100%{filter:saturate(1.03) contrast(1.02)}73%{filter:saturate(1.22) contrast(1.08) brightness(1.05)}76%{filter:saturate(1.1) contrast(1.04)}}
    @keyframes volcano{0%,100%{opacity:.4;filter:blur(1px)}50%{opacity:1;filter:blur(5px)}}
    @keyframes ray{0%,10%{background-position:0 0,-90% 0}45%,100%{background-position:0 0,160% 0}}
    @keyframes sweep{0%,18%{background-position:130% 0;opacity:0}35%{opacity:.82}62%,100%{background-position:-70% 0;opacity:0}}
    @keyframes fly{0%{transform:translateX(0) translateY(5vh) scale(.65)}45%{transform:translateX(62vw) translateY(-3vh) scale(1)}100%{transform:translateX(96vw) translateY(3vh) scale(.72)}}
    @keyframes flap{to{transform:scaleY(.72) rotate(-2deg)}}@keyframes badge{50%{transform:scale(1.045);box-shadow:0 0 35px #ff9a3077}}
  </style>
</head>
<body><main class="reel" aria-label="Animiertes Very Safe Dino Park Reel">
  <img class="poster" src="poster.jpg?v=1" alt="Very Safe Dino Park – am Release-Tag sind Kaleyco, Freunde und ich dabei">
  <div class="depth"></div><div class="ptero" aria-hidden="true"><svg viewBox="0 0 180 70"><path fill="#17351f" d="M89 36C64 15 38 8 2 15c24 7 42 17 55 31-17-2-29 1-39 9 25-3 44 1 66 13l6-18 6 18c22-12 41-16 66-13-10-8-22-11-39-9 13-14 31-24 55-31-36-7-62 0-87 21z"/><path fill="#0b1b10" d="M84 38l6-16 7 16-7 12z"/></svg></div>
  <div class="vignette"></div><div class="shine"></div><canvas></canvas><div class="badge">RELEASE-DAY HYPE</div>
</main><script>
  const c=document.querySelector('canvas'),x=c.getContext('2d'),stage=document.querySelector('.reel');let w,h,dpr,items=[];
  function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(stage);resize();
  function leaf(){items.push({x:Math.random()*w,y:-30,r:4+Math.random()*10,vx:-.25+Math.random()*.7,vy:.35+Math.random()*.8,a:.25+Math.random()*.55,rot:Math.random()*6,vr:(Math.random()-.5)*.035,c:['#b8d936','#5e9d24','#f4bf31','#87c72f'][Math.floor(Math.random()*4)]})}
  function drawLeaf(o){x.save();x.translate(o.x,o.y);x.rotate(o.rot);x.scale(1,.55);x.fillStyle=o.c;x.globalAlpha=o.a;x.shadowBlur=7;x.shadowColor=o.c;x.beginPath();x.ellipse(0,0,o.r,o.r*.55,0,0,Math.PI*2);x.fill();x.restore()}
  function loop(){x.clearRect(0,0,w,h);if(items.length<30&&Math.random()<.1)leaf();items=items.filter(o=>{o.x+=o.vx+Math.sin(o.y*.025)*.18;o.y+=o.vy;o.rot+=o.vr;drawLeaf(o);return o.y<h+40});requestAnimationFrame(loop)}loop();
</script></body></html>
