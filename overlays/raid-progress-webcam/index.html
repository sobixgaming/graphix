<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raid Progress – Webcam Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:transparent!important;isolation:isolate}
#frame,.masked{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#frame{z-index:2;object-fit:fill;filter:drop-shadow(0 0 4px rgba(25,155,255,.28)) drop-shadow(0 0 5px rgba(255,20,236,.2))}
.masked{z-index:4;-webkit-mask:url('frame.png?v=1') center/100% 100% no-repeat;mask:url('frame.png?v=1') center/100% 100% no-repeat}
#shimmer{background:linear-gradient(108deg,transparent 0 41%,rgba(180,241,255,.08) 45%,rgba(255,255,255,.92) 49%,rgba(165,234,255,.18) 53%,transparent 58%);transform:translateX(-125%);mix-blend-mode:screen;filter:blur(.6px);animation:shimmer 5.6s ease-in-out infinite}
#softPulse{z-index:3;background:linear-gradient(90deg,rgba(0,183,255,.35),rgba(255,0,220,.3));mix-blend-mode:screen;filter:blur(8px);opacity:.12;animation:framePulse 4.2s ease-in-out infinite}
.gem{position:absolute;z-index:5;left:var(--x);top:var(--y);width:var(--s);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(var(--c),.9) 0 9%,rgba(var(--c),.46) 23%,rgba(var(--c),.13) 48%,transparent 72%);mix-blend-mode:screen;filter:blur(1.3px);animation:gemPulse var(--t,2.8s) ease-in-out infinite var(--d,0s)}
.gem:after{content:"";position:absolute;left:50%;top:50%;width:68%;height:68%;transform:translate(-50%,-50%) rotate(45deg);background:linear-gradient(90deg,transparent 47%,rgba(255,255,255,.8) 50%,transparent 53%),linear-gradient(0deg,transparent 47%,rgba(255,255,255,.68) 50%,transparent 53%);opacity:.28;animation:twinkle 3.4s ease-in-out infinite var(--d,0s)}
@keyframes shimmer{0%{transform:translateX(-125%);opacity:0}3%{opacity:.2}12%{opacity:1}24%{transform:translateX(125%);opacity:.75}27%,100%{transform:translateX(125%);opacity:0}}
@keyframes framePulse{0%,100%{opacity:.07}50%{opacity:.18}}
@keyframes gemPulse{0%,100%{opacity:.3;transform:translate(-50%,-50%) scale(.88)}50%{opacity:.72;transform:translate(-50%,-50%) scale(1.14)}}
@keyframes twinkle{0%,70%,100%{opacity:.08;transform:translate(-50%,-50%) rotate(45deg) scale(.7)}78%{opacity:.62;transform:translate(-50%,-50%) rotate(45deg) scale(1.12)}86%{opacity:.16}}
</style>
</head>
<body>
<main id="stage" aria-label="Animierter Raid-Progress-Webcam-Rahmen">
 <img id="frame" src="frame.png?v=1" alt="Raid Progress Webcam-Rahmen">
 <div id="softPulse" class="masked"></div><div id="shimmer" class="masked"></div>
 <i class="gem" style="--x:50%;--y:8.3%;--s:8.5%;--c:90,220,255;--t:3s"></i>
 <i class="gem" style="--x:49.9%;--y:8.7%;--s:5.2%;--c:255,40,245;--d:-1.1s"></i>
 <i class="gem" style="--x:4.5%;--y:8%;--s:4.8%;--c:30,214,255;--d:-.4s"></i>
 <i class="gem" style="--x:92.9%;--y:8.2%;--s:5.2%;--c:255,32,232;--d:-1.8s"></i>
 <i class="gem" style="--x:4.6%;--y:33.8%;--s:4.2%;--c:245,24,236;--d:-2.2s"></i>
 <i class="gem" style="--x:3.8%;--y:47.2%;--s:4.5%;--c:20,205,255;--d:-.8s"></i>
 <i class="gem" style="--x:95.2%;--y:34.1%;--s:4.2%;--c:255,27,237;--d:-1.3s"></i>
 <i class="gem" style="--x:96.1%;--y:47.4%;--s:4.4%;--c:30,210,255;--d:-2.7s"></i>
 <i class="gem" style="--x:6.4%;--y:84.2%;--s:6.5%;--c:28,211,255;--d:-1.6s"></i>
 <i class="gem" style="--x:9.2%;--y:90.6%;--s:5.7%;--c:255,31,232;--d:-.5s"></i>
 <i class="gem" style="--x:91.3%;--y:90.2%;--s:6.3%;--c:255,37,235;--d:-2.1s"></i>
 <i class="gem" style="--x:95.4%;--y:83.8%;--s:5.2%;--c:43,213,255;--d:-1s"></i>
 <i class="gem" style="--x:49.8%;--y:95.1%;--s:4.1%;--c:54,211,255;--d:-1.9s"></i>
</main>
</body>
</html>
